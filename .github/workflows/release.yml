name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: npm verifies the package was built by this
  # workflow, from this commit, so consumers can trace a tarball to its source.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Whether a fallback token exists. Secrets cannot be read in a step `if`,
      # but this job-level expression can, and it leaks nothing: only a boolean.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24, not 22. Trusted publishing needs npm >= 11.5.1 and Node 22
          # ships npm 10.9.x, which has no OIDC support at all — the publish
          # would fall back to asking for a token that is not there.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # The published tarball is what users get, so assert its contents rather
      # than trusting `files`. A missing dist/ or an accidentally shipped
      # node_modules only shows up here.
      - name: Verify package contents
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          # The ${} below are JS template literals evaluated by node; shell
          # expansion would corrupt them, so single quotes are deliberate.
          # shellcheck disable=SC2016
          node -e '
            const p = require("/tmp/pack.json")[0];
            const names = p.files.map(f => f.path);
            const need = ["dist/cli.js", "dist/index.js", "README.md", "LICENSE"];
            const missing = need.filter(n => !names.includes(n));
            if (missing.length) { console.error("missing from tarball:", missing); process.exit(1); }
            const junk = names.filter(n => n.startsWith("node_modules/") || n.startsWith("test/") || n.endsWith(".test.ts"));
            if (junk.length) { console.error("should not ship:", junk.slice(0, 10)); process.exit(1); }
            console.log(`ok: ${names.length} files, ${(p.size/1024).toFixed(1)} KB packed`);
          '

      # The installed binary must actually run. A broken shebang or a bad
      # `bin` path passes every other check and fails on the user's machine.
      - name: Smoke-test the packed binary
        run: |
          npm pack --silent
          tarball=$(ls codeindex-sync-*.tgz)
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$tarball" --silent
          ./node_modules/.bin/codeindex-sync --version
          ./node_modules/.bin/codeindex-sync providers --example | node -e 'JSON.parse(require("fs").readFileSync(0));console.log("example config parses")'

      # npm's OIDC support is version-gated and fails in a confusing way when
      # absent, so check it here where the message can say what is wrong.
      - name: Check npm supports trusted publishing
        if: github.event_name == 'release' && env.HAS_NPM_TOKEN != 'true'
        run: |
          have=$(npm -v)
          need=11.5.1
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is too old for trusted publishing (need >= $need)" >&2
            echo "either bump node-version, or set the NPM_TOKEN secret" >&2
            exit 1
          fi
          echo "npm $have supports OIDC"

      # Preferred path: no long-lived credential anywhere. Requires a trusted
      # publisher configured at npmjs.com for this package, naming this repo and
      # this workflow file (release.yml, case-sensitive). Provenance is attached
      # automatically, so --provenance is not passed.
      #
      # This cannot do the FIRST publish: a trusted publisher is configured in a
      # package's settings, and those do not exist until the package does.
      # See npm/cli#8544. Publish 0.1.0 with a token (or from a laptop), then
      # configure trusted publishing and delete the token.
      - name: Publish via trusted publishing (OIDC)
        if: github.event_name == 'release' && env.HAS_NPM_TOKEN != 'true'
        run: npm publish --access public

      - name: Publish with a token
        if: github.event_name == 'release' && env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
