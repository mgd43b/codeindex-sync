name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Build BEFORE test: the CLI smoke tests exercise dist/cli.js as a
      # subprocess, which is the only way to assert exit codes and the text a
      # human actually reads on failure.
      - run: npm run build
      - run: npm test
