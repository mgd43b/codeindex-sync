version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group routine bumps into one PR. Five separate PRs for transitive dev
    # dependencies is how people learn to ignore Dependabot, which is worse
    # than not running it — the alert that matters then looks like the rest.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
    # Majors stay separate: they need a human to read the changelog.
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: [ci]
