version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group routine bumps into one PR. Five separate PRs for transitive dev
    # dependencies is how people learn to ignore Dependabot, which is worse
    # than not running it — the alert that matters then looks like the rest.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
    # Majors stay separate: they need a human to read the changelog.
    labels: [dependencies]
    ignore:
      # @types/node must track the MINIMUM supported runtime (engines: >=20),
      # not the newest release. Newer types let tsc accept APIs that do not
      # exist on Node 20 and crash there at runtime — a failure CI cannot see,
      # because it type-checks once against whatever version is installed.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # A TypeScript major is uninstallable until the lint toolchain catches
      # up: typescript-eslint pins its peer to "<6.1.0", so npm ci dies with
      # ERESOLVE before lint, typecheck, build or test ever run. Dependabot
      # cannot see this — it resolves the lockfile, not the install — so it
      # will re-propose the same dead PR every week (see PR #9, TS 7.0.2).
      # Revisit when typescript-eslint widens the range. TS 7 is the Go
      # rewrite, so that upgrade wants a deliberate look at emit and strict
      # behaviour anyway, not a rubber-stamped bump.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: [ci]
